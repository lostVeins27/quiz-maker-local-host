<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="free website to make quizzes" />
    <meta name="keyword" content="free quiz site,quiz site" />
    <meta name="author" content="Zion, Daniel, Isel" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>

  <body>
    <div id="login-message" role="alert" aria-live="polite" hidden></div>

    <form id="login-form" novalidate method="post">
      <div>
        <h1>Welcome to Quiz-Maker</h1>
        <p>Log in to your account.</p>
      </div>

      <div>
        <label for="email">Email</label><br>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          autocapitalize="none"
          spellcheck="false"
          required
          autofocus
        />
        <span id="email-error" class="field-error" hidden></span>
      </div>

      <div>
        <label for="password">Password</label><br>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />

        <button
          type="button"
          id="toggle-password"
          aria-controls="password"
          aria-pressed="false"
        >
          Show
        </button>
        <span id="password-error" class="field-error" hidden></span>
      </div>

      <button type="submit" id="login-button">Submit</button>
    </form>

    <p>
      Don't have an account?
      <a href="/signup" id="signup-link">Sign up</a>
    </p>

    <script src="{{ url_for('static', filename='login.js') }}" defer></script>>
  </body>
</html>
