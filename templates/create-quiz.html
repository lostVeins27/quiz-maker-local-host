<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Quiz</title>
    <link rel="stylesheet" href="{{url_for('static', filename='create-quiz.css')}}" />
  </head>

  <body id="page-body">
    <main id="main-create-quiz-page">
      <!--button to go back to the professor dashboard-->
      <nav id="dashboard-nav">
        <button type="button" id="dashboard-btn">Back to Dashboard</button>
      </nav>

      <h1 id="page-title">Create Quiz</h1>

      <!--notice shown by the JavaScript when saving is not connected yet-->
      <p id="api-status-notice" hidden>
        Saving is not connected to the backend yet, so your quiz will not be saved.
      </p>

      <!--form of the elements of the create quiz page-->
      <form id="quiz-form" novalidate>

        <!--box with the quiz title and description-->
        <fieldset id="quiz-information">
          <legend id="quiz-information-legend">Quiz Information</legend>

          <!--quiz title text-field-->
          <div id="quiz-title-field">
            <label for="quiz-title" id="quiz-title-label">Quiz Title</label>
            <input type="text" id="quiz-title" name="quizTitle" />
            <p class="error-message" id="quiz-title-error"></p>
          </div>

          <!--description or instructions for the students (optional)-->
          <div id="quiz-description-field">
            <label for="quiz-description" id="quiz-description-label">Description / Instructions</label>
            <textarea id="quiz-description" name="quizDescription" rows="4"></textarea>
          </div>
        </fieldset>

        <!--questions part-->
        <section id="questions-section" aria-labelledby="questions-heading">

          <h2 id="questions-heading">Questions</h2>

          <!--the JavaScript adds each question box in here-->
          <div id="questions-container"></div>

          <!--error shown by the JavaScript when the quiz has no questions-->
          <p class="error-message" id="questions-error"></p>

          <!--add question button (type="button" so it does not submit the form)-->
          <button type="button" id="add-question-btn">Add Question</button>
        </section>

        <!--save quiz button-->
        <button type="submit" id="save-quiz-btn">Save Quiz</button>

        <!--message shown after pressing save (success, error or warning)-->
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="{{url_for('static', filename='create-quiz.js')}}"></script>
  </body>
</html>
