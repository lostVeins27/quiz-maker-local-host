<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Quizzes</title>
    <link rel="stylesheet" href="{{url_for('static', filename='manage-quiz.css')}}" />
  </head>

  <body id="page-body">
    <main id="main-manage-quiz-page">

      <!--page header: title, short description and the create quiz link-->
      <header id="page-header">
        <div id="page-heading">
          <h1 id="page-title">Manage Quizzes</h1>
          <p id="page-description">View, search, edit, and delete your quizzes.</p>
        </div>
        <!--buttons on the right: to dashboard on top, create quiz below-->
        <div id="header-actions">
          <a id="dashboard-link" href="#">To Dashboard</a>
          <a id="create-quiz-link" href="#">Create Quiz</a>
        </div>
      </header>

      <!--notice shown by the JavaScript when the quiz list is not connected yet-->
      <p id="api-status-notice" hidden>
        The quiz list is not connected to the backend yet, so no quizzes can be shown.
      </p>

      <!--white box with the search bar, the quiz table and the pagination-->
      <section id="quiz-list-section" aria-labelledby="quiz-list-heading">
        <h2 id="quiz-list-heading" class="visually-hidden">Quiz List</h2>

        <!--search bar-->
        <div id="quiz-toolbar">
          <label for="quiz-search" class="visually-hidden">Search quizzes by title</label>
          <input type="search" id="quiz-search" placeholder="Search quiz by title..." autocomplete="off" />
        </div>

        <!--the JavaScript fills this table with the quizzes of the current page-->
        <div id="quiz-table-wrapper">
          <table id="quiz-table">
            <thead>
              <tr>
                <th scope="col">Quiz Title</th>
                <th scope="col">Questions</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="quiz-table-body"></tbody>
          </table>
        </div>

        <!--loading, empty, no results or error message (the JavaScript fills it)-->
        <p id="quiz-list-message" role="status" aria-live="polite"></p>

        <!--pagination-->
        <nav id="pagination" aria-label="Quiz list pages" hidden>
          <p id="pagination-info"></p>
          <div id="pagination-controls">
            <button type="button" id="previous-page-btn">Previous</button>
            <span id="page-indicator"></span>
            <button type="button" id="next-page-btn">Next</button>
          </div>
        </nav>
      </section>

      <!--message shown after deleting or saving a quiz (success or error)-->
      <p id="form-message" role="status" aria-live="polite"></p>

      <!--white box that opens below the list when Edit is pressed (the JavaScript fills it)-->
      <section id="edit-quiz-section" aria-labelledby="edit-quiz-heading" hidden>
        <h2 id="edit-quiz-heading">Edit Quiz</h2>

        <!--loading message while the quiz is being opened-->
        <p id="edit-quiz-status" role="status" aria-live="polite"></p>

        <form id="edit-quiz-form" novalidate>
          <fieldset id="edit-quiz-fieldset">
            <legend class="visually-hidden">Quiz title, description and questions</legend>

            <!--quiz title-->
            <div class="edit-field">
              <label for="edit-quiz-title" class="edit-label">Quiz Title</label>
              <input type="text" id="edit-quiz-title" class="edit-input" autocomplete="off" />
              <p class="error-message" id="edit-quiz-title-error"></p>
            </div>

            <!--quiz description-->
            <div class="edit-field">
              <label for="edit-quiz-description" class="edit-label">Description</label>
              <textarea id="edit-quiz-description" class="edit-input" rows="3"></textarea>
            </div>

            <!--the JavaScript adds one box for each question of the quiz-->
            <h3 id="edit-questions-heading">Questions</h3>
            <div id="edit-questions-list"></div>
            <p class="error-message" id="edit-questions-error"></p>

            <!--choose a type and add a new question-->
            <div id="add-question-controls">
              <label for="new-question-type" class="visually-hidden">Type of the new question</label>
              <select id="new-question-type" class="edit-input">
                <option value="multiple_choice">Multiple Choice</option>
                <option value="identification">Identification</option>
              </select>
              <button type="button" id="add-question-btn">Add Question</button>
            </div>

            <!--error message of the whole form-->
            <p class="error-message" id="edit-quiz-error" aria-live="polite"></p>

            <!--cancel and save buttons-->
            <div id="edit-quiz-actions">
              <button type="button" id="cancel-edit-btn">Cancel</button>
              <button type="submit" id="save-quiz-btn">Save Changes</button>
            </div>
          </fieldset>
        </form>
      </section>
    </main>

    <!--delete confirmation dialog-->
    <dialog id="delete-dialog" aria-labelledby="delete-dialog-title">
      <h2 id="delete-dialog-title">Delete Quiz</h2>
      <p id="delete-dialog-text"></p>
      <p class="error-message" id="delete-dialog-error"></p>
      <div id="delete-dialog-actions">
        <button type="button" id="cancel-delete-btn">Cancel</button>
        <button type="button" id="confirm-delete-btn">Delete</button>
      </div>
    </dialog>

    <script src="{{ url_for('static', filename='manage-quiz.js') }}" defer></script>
  </body>
</html>
