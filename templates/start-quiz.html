<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Quiz</title>
  <link rel="stylesheet" href="{{url_for('static', filename='start-quiz.css')}}">
</head>
<body>

  <div id="quiz-timer-banner" style="display: none; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; font-size: 18px; font-weight: 600; text-align: center;">
        Time Remaining: <span id="timer-countdown">--:--</span>
      </div>

  <div id="start-quiz-page">

    <!-- Page header -->
    <header id="start-quiz-header">
      <div id="start-quiz-heading">
        <h1 id="start-quiz-title">Start Quiz</h1>
        <p id="start-quiz-subtitle">Search and start one of your quizzes.</p>
      </div>

      <div id="start-quiz-header-buttons">
        <a id="to-dashboard-button" href="/dashboard">To Dashboard</a>
        <a id="create-quiz-button" href="/create-quiz">Create Quiz</a>
      </div>
    </header>

    <!-- Quiz list card -->
    <main id="quiz-card">
      <input type="text" id="search-input" placeholder="Search quiz by title...">

      <table id="quiz-table">
        <thead>
          <tr>
            <th>Quiz Title</th>
            <th>Questions</th>
            <th>Actions</th>
            <th>PIN</th>
          </tr>
        </thead>
        <tbody id="quiz-table-body"></tbody>
      </table>

      <!-- Pagination -->
      <div id="pagination">
        <span id="showing-text"></span>
        <div id="pagination-buttons">
          <button type="button" id="previous-button">Previous</button>
          <span id="page-text"></span>
          <button type="button" id="next-button">Next</button>
        </div>
      </div>
    </main>

    <!-- Test box: opens below the quiz list when Test is pressed (the JavaScript fills it) -->
    <section id="test-box" aria-labelledby="test-box-title" hidden>
      <div id="test-box-header">
        <h2 id="test-box-title"></h2>
        <button type="button" id="test-close-button">Close</button>
      </div>
      <p id="test-box-description"></p>

      <form id="test-form" novalidate>
        <div id="test-questions"></div>

        <!-- Submit first. The small Score button appears after submitting. -->
        <div id="test-actions">
          <button type="submit" id="test-submit-button">Submit</button>
          <button type="button" id="test-score-button" hidden>Score</button>
        </div>
        <div id="test-score-text" role="status" aria-live="polite" hidden></div>
      </form>
    </section>

  </div>

  <!-- Confirm popup (used for both starting and ending a quiz, the JavaScript fills the title and the message) -->
  <div id="confirm-overlay" hidden>
    <div id="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Start Quiz</h2>
      <p id="confirm-message"></p>

      <!-- Timing Configuration Options (Shown when starting) -->
      <div id="quiz-timing-options" style="margin-bottom: 20px;" hidden>
        <label style="display: block; margin-bottom: 10px; font-weight: 600; cursor: pointer;">
          <input type="radio" name="timing-type" value="untimed" checked style="margin-right: 8px;"> No Time Limit (Untimed)
        </label>
        <label style="display: block; margin-bottom: 10px; font-weight: 600; cursor: pointer;">
          <input type="radio" name="timing-type" value="timed" style="margin-right: 8px;"> Timed Quiz
        </label>
        <div id="duration-container" style="margin-left: 24px;" hidden>
          <label for="quiz-duration-input" style="display: block; font-size: 14px; margin-bottom: 4px; color: #4b5563;">Duration (minutes):</label>
          <input type="number" id="quiz-duration-input" min="1" max="300" value="10" style="width: 120px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 16px;">
        </div>
      </div>

      <div id="confirm-buttons">
        <button type="button" id="confirm-no-button">No</button>
        <button type="button" id="confirm-yes-button">Yes</button>
      </div>
    </div>
  </div>

  <script src="{{url_for('static', filename='start-quiz.js')}}"></script>
</body>
</html>
