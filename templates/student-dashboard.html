<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="{{url_for('static', filename='student-dashboard.css')}}">
</head>
<body id="pageBody">

  <h1 id="pageTitle">Welcome {{user[1]}}!</h1>

  <nav id="logoutNav">
    <button type="button" id="logoutBtn">Logout</button>
  </nav>

  <div id="buttonContainer">

    <button type="button" id="TakeQuizBtn">
      <span>Take quiz</span>
      <div class="TakeQuiz"></div>
    </button>

    <button type="button" id="ResultBtn">
      <span>Results</span>
      <div class="CheckResult"></div>
    </button>
  </div>

  <script src="{{url_for('static', filename='student-dashboard.js')}}"></script>
</body>
</html>
