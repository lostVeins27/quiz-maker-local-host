<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Take Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='take-quiz-pin.css') }}" />
  </head>

  <body id="page-body">
    <main id="main-pin-page">
      <!--button at the top right: back to the student dashboard-->
      <nav id="dashboard-nav">
        <button type="button" id="dashboard-btn">Back to Dashboard</button>
      </nav>

      <h1 id="page-title">Take Quiz</h1>

      <!--form with the PIN box-->
      <form id="pin-form" novalidate>

        <!--box with the PIN text-field-->
        <fieldset id="pin-information">
          <legend id="pin-legend">Quiz PIN</legend>

          <label for="quiz-pin" id="quiz-pin-label">Enter the 5-digit PIN to open the quiz</label>
          <input type="text" id="quiz-pin" name="quizPin" inputmode="numeric" maxlength="5" autocomplete="off" />
          <p class="error-message" id="quiz-pin-error"></p>
        </fieldset>

        <!--enter quiz button-->
        <button type="submit" id="enter-quiz-btn">Enter Quiz</button>

        <!--message shown after pressing enter (error or checking)-->
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="{{ url_for('static', filename='take-quiz-pin.js') }}"></script>
  </body>
</html>
