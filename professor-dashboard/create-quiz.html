<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Quiz</title>
  </head>

  <body>
    <main>
      <h1>Create Quiz</h1>

      <form id="quiz-form" class="create-quiz-form" novalidate>

        <fieldset class="quiz-information">
          <legend>Quiz Information</legend>

          <div class="form-field">
            <label for="quiz-title">Quiz Title</label>
            <input type="text" id="quiz-title" name="quizTitle" />
            <p class="error-message" id="quiz-title-error"></p>
          </div>

          <!-- Description or instructions for the students (optional). -->
          <div class="form-field">
            <label for="quiz-description">Description / Instructions</label>
            <textarea id="quiz-description" name="quizDescription" rows="4"></textarea>
          </div>
        </fieldset>

          <section class="questions" aria-labelledby="questions-heading">

          <h2 id="questions-heading">Questions</h2>

          <div id="questions-container"></div>

          <!-- Shown by the JavaScript when the quiz has no questions at all. -->
          <p class="error-message" id="questions-error"></p>

          <!-- type="button" means "do not submit the form". It only adds a question. -->
          <button type="button" id="add-question-btn">Add Question</button>
        </section>

        <button type="submit" id="save-quiz-btn">Save Quiz</button>

        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="create-quiz.js"></script>
  </body>
</html>
